<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Área Administrativa</title>
</head>

<body data-tipo="admin">

<h2>Painel do Administrador</h2>

<h3>Funcionários Cadastrados</h3>

<table border="1" width="100%">
    <thead>
        <tr>
            <th>Nome</th>
            <th>Matrícula</th>
            <th>Email</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody id="tabelaFuncionarios">
        <!-- preenchido via JS -->
    </tbody>
</table>

<hr>

<div id="editarFuncionario" style="display:none;">
    <h3>Editar Funcionário</h3>

    <input type="hidden" id="editFuncId">

    <label>Nome:</label><br>
    <input type="text" id="editFuncNome"><br><br>

    <label>Email:</label><br>
    <input type="email" id="editFuncEmail"><br><br>

    <button onclick="salvarEdicaoFuncionario()">Salvar</button>
    <button onclick="cancelarEdicaoFuncionario()">Cancelar</button>
</div>


<button onclick="logout()">Sair</button>

<!--<script src="auth.js"></script> -->
<script src="script.js"></script>

</body>
</html>
