<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Área do Cliente</title>
</head>
<body>

<script>
    const usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado'));
    if (!usuarioLogado || usuarioLogado.tipo !== 'cliente') {
        alert('Acesso restrito');
        window.location.href = 'index.html';
    }
</script>

<h2>Bem-vindo, Cliente</h2>

<p>Suas informações:</p>

<ul>
    <li>Nome: <span id="nomeCliente"></span></li>
    <li>Email: <span id="emailCliente"></span></li>
</ul>

<h3>Meus Dados</h3>

<p>Nome: <span id="meuNome"></span></p>
<p>Email: <span id="meuEmail"></span></p>

<script>
    const usuario = JSON.parse(localStorage.getItem('usuarioLogado'));
    document.getElementById('meuNome').innerText = usuario.nome;
    document.getElementById('meuEmail').innerText = usuario.email;
</script>


<button onclick="logout()">Sair</button>

<script>
    document.getElementById('nomeCliente').innerText = usuarioLogado.nome;
    document.getElementById('emailCliente').innerText = usuarioLogado.email;
</script>

<script src="script.js"></script>
</body>
</html>
