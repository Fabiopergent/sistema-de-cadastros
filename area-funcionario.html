<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Área do Funcionário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-tipo="funcionario">

<h2>Painel do Funcionário</h2>

<button onclick="mostrarCadastro()">Cadastrar Cliente</button>

<div id="cadastroCliente" style="display:none;">
    <h3>Novo Cliente</h3>

    <input type="text" id="nome" placeholder="Nome Completo"><br><br>
    <input type="email" id="email" placeholder="Email"><br><br>
    <input type="password" id="senha" placeholder="Senha"><br><br>
    <input type="text" id="cpf" placeholder="CPF"><br><br>
    <input type="text" id="telefone" placeholder="Telefone"><br><br>
    <input type="text" id="endereco" placeholder="Endereço"><br><br>

    <button onclick="cadastrarCliente()">Salvar</button>
</div>

<hr>

<h3>Agendar Consulta</h3>

<select id="clienteConsulta">
    <option value="">Selecione um cliente</option>
</select><br><br>

<input type="date" id="dataConsulta"><br><br>
<input type="time" id="horaConsulta"><br><br>

<select id="tipoConsulta">
    <option value="">Tipo de consulta</option>
    <option value="Clínica Geral">Clínica Geral</option>
    <option value="Cardiologia">Cardiologia</option>
    <option value="Dermatologia">Dermatologia</option>
</select><br><br>

<button onclick="agendarConsulta()">Agendar</button>


<br>
<button onclick="logout()">Sair</button>

<script src="auth.js"></script>
<script src="script.js"></script>
</body>
</html>
