<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Área do Funcionário</title>
</head>
<body>

<script>
    const usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado'));
    if (!usuarioLogado || usuarioLogado.tipo !== 'funcionario') {
        alert('Acesso restrito');
        window.location.href = 'index.html';
    }
</script>

<h2>Bem-vindo, Funcionário</h2>

<p>Aqui você poderá cadastrar clientes no futuro.</p>

<h3>Cadastrar Cliente</h3>

<form id="formCliente">
    <input type="text" id="nomeCliente" placeholder="Nome" required>
    <input type="email" id="emailCliente" placeholder="Email" required>
    <input type="password" id="senhaCliente" placeholder="Senha" required>
    <button type="submit">Cadastrar Cliente</button>
</form>

<hr>

<h3>Lista de Clientes</h3>
<ul id="listaClientes"></ul>

<button onclick="logout()">Sair</button>

<script src="script.js"></script>
</body>
</html>
