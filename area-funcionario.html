<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Área do Funcionário</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="style.css">
</head>

<body data-tipo="funcionario">

<h2>Painel do Funcionário</h2>

<button id="btnCadastrarCliente">Cadastrar Cliente</button>

<div id="cadastroCliente" style="display:none;">
    <h3>Novo Cliente</h3>

    <input type="text" id="clienteNome" placeholder="Nome Completo"><br><br>
    <input type="email" id="clienteEmail" placeholder="Email"><br><br>
    <input type="password" id="clienteSenha" placeholder="Senha"><br><br>
    <input type="text" id="clienteCpf" placeholder="CPF"><br><br>
    <input type="text" id="clienteTelefone" placeholder="Telefone"><br><br>
    <input type="text" id="clienteEndereco" placeholder="Endereço"><br><br>

    <button onclick="cadastrarCliente()">Salvar</button>
</div>

<hr>

<h3>📅 Agendamento de Consulta</h3>

<label>Cliente:</label><br>
<select id="clienteConsulta">
    <option value="">Selecione um cliente</option>
</select><br><br>

<!-- DADOS DO CLIENTE -->
<div id="infoCliente" style="display:none; margin-top:20px;">
    <h3>📋 Dados do Cliente</h3>

    <label>Email:</label><br>
    <input type="email" id="editEmail"><br><br>

    <label>Telefone:</label><br>
    <input type="text" id="editTelefone"><br><br>

    <label>Endereço:</label><br>
    <input type="text" id="editEndereco"><br><br>

    <button onclick="salvarContatoCliente()">💾 Salvar Alterações</button>

    <hr>

    <h3>📅 Consultas Agendadas</h3>
    <ul id="listaConsultasCliente"></ul>
</div>

<hr>

<label>Data:</label><br>
<input type="date" id="dataConsulta"><br><br>

<label>Horário:</label><br>
<input type="time" id="horaConsulta"><br><br>

<label>Tipo de Consulta:</label><br>
<select id="tipoConsulta">
    <option value="">Selecione</option>
    <option value="Clínica Geral">Clínica Geral</option>
    <option value="Cardiologia">Cardiologia</option>
    <option value="Dermatologia">Dermatologia</option>
</select><br><br>

<button onclick="agendarConsulta()">Agendar Consulta</button>

<br><br>
<button onclick="logout()">Sair</button>

<script src="auth.js"></script>
<script src="script.js"></script>



</body>
</html>
